name: SkyED Control Panel CI

on:
  push:
    branches:
      - feature/control-panel-unified-v2.2.0
    paths:
      - 'skyed_control_panel.py'
      - 'skyed_control/**'
      - 'scripts/Install-SkyED-ControlPanel-v2.2.0.ps1'
      - 'scripts/package_control_panel.py'
      - 'tests/test_control_panel_*.py'
      - 'docs/CONTROL-PANEL-v2.2.0.md'
      - '.github/workflows/control-panel-ci.yml'
  pull_request:
    branches:
      - feature/homework-automation-v2
    paths:
      - 'skyed_control_panel.py'
      - 'skyed_control/**'
      - 'scripts/Install-SkyED-ControlPanel-v2.2.0.ps1'
      - 'scripts/package_control_panel.py'
      - 'tests/test_control_panel_*.py'
      - 'docs/CONTROL-PANEL-v2.2.0.md'
      - '.github/workflows/control-panel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyed-control-panel-ci
  cancel-in-progress: true

jobs:
  linux-desktop-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax and standalone registry
        run: |
          python -m py_compile skyed_control_panel.py skyed_control/__init__.py skyed_control/registry.py scripts/package_control_panel.py
          python -m unittest discover -s tests -p 'test_control_panel_registry.py' -v
      - name: Install real Qt desktop runtime
        run: python -m pip install 'PySide6>=6.7,<7'
      - name: Headless Qt creation, navigation and smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p 'test_control_panel_qt.py' -v
          python skyed_control_panel.py --smoke-test
      - name: Build and verify five-member overlay ZIP
        run: |
          python scripts/package_control_panel.py --out dist/SkyED-ControlPanel-v2.2.0.zip
          python -c "import zipfile; p='dist/SkyED-ControlPanel-v2.2.0.zip'; z=zipfile.ZipFile(p); assert z.testzip() is None; assert len(z.namelist()) == 6; print('CONTROL_PANEL_DISTRIBUTION=PASS')"
      - name: Publish verified Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyED-ControlPanel-v2.2.0
          path: dist/SkyED-ControlPanel-v2.2.0.zip
          if-no-files-found: error
          retention-days: 30

  windows-desktop-gates:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse and verify PowerShell installer without running it
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Install-SkyED-ControlPanel-v2.2.0.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'SKYED_INSTALLER_SYNTAX=PASS'
      - name: Python and registry tests
        shell: pwsh
        run: |
          python -m py_compile skyed_control_panel.py skyed_control/registry.py scripts/package_control_panel.py
          python -m unittest discover -s tests -p 'test_control_panel_registry.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'REGISTRY_TEST_FAILURE' }
      - name: Install actual Windows Qt runtime
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Windows Qt creation and interactive route state
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p 'test_control_panel_qt.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_QT_TEST_FAILURE' }
          python skyed_control_panel.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_QT_START_FAILURE' }

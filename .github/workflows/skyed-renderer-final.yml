name: SkyED minimal renderer release
on:
  push:
    branches:
      - feature/homework-automation-v2
    paths:
      - scripts/finish_skyed_renderer_v225.py
      - scripts/skyed_renderer_remote_v225.sh
      - scripts/Complete-SkyED-Release-v2.2.25.ps1
      - tests/test_finish_skyed_release_v225.py
      - tests/test_skyed_remote_transaction_v225.py
      - .github/workflows/skyed-renderer-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python and remote Bash
        run: |
          python -m py_compile scripts/finish_skyed_renderer_v225.py tests/test_finish_skyed_release_v225.py tests/test_skyed_remote_transaction_v225.py
          bash -n scripts/skyed_renderer_remote_v225.sh
      - name: Execute focused regression tests
        run: python -m unittest discover -s tests -p 'test_*v225.py' -v
      - name: Package only the final executable files
        run: |
          mkdir -p dist
          cp scripts/finish_skyed_renderer_v225.py dist/
          cp scripts/skyed_renderer_remote_v225.sh dist/
          cp scripts/Complete-SkyED-Release-v2.2.25.ps1 dist/Complete-SkyED-Release-v2.2.26.ps1
          test "$(find dist -type f | wc -l)" -eq 3
          echo MINIMAL_BUILD=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: SkyED-Final-Renderer-v2.2.26
          path: dist/
          if-no-files-found: error
  windows-script-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell script syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Complete-SkyED-Release-v2.2.25.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Output 'WINDOWS_POWERSHELL_PARSE=PASS'
